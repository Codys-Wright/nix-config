name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: nix
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Expose NixOS system profile tools
        run: |
          set -euo pipefail
          echo /run/current-system/sw/bin >> "$GITHUB_PATH"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: nix flake check
        run: nix flake check --print-build-logs --no-write-lock-file

  fmt:
    runs-on: nix
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Expose NixOS system profile tools
        run: |
          set -euo pipefail
          echo /run/current-system/sw/bin >> "$GITHUB_PATH"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: nixfmt --check
        run: |
          nix run --no-write-lock-file nixpkgs#nixfmt-rfc-style -- --check \
            $(find . -name '*.nix' -not -path './.git/*' -not -path './result*')
