name: Validate dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: thebattleship-dev-validation
  cancel-in-progress: false

jobs:
  validate-dev:
    name: Validate dev integration branch
    runs-on: nix
    permissions:
      contents: read
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Print validation identity
        run: |
          set -euo pipefail
          echo "repository=${GITHUB_REPOSITORY}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "checkout=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Expose NixOS system profile tools
        run: |
          set -euo pipefail
          echo /run/current-system/sw/bin >> "$GITHUB_PATH"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Run dev validation checks
        run: |
          set -euo pipefail
          nix flake check --no-write-lock-file --show-trace
          just build-host THEBATTLESHIP

      - name: Validation summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## nix-fleet dev validation"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Target: THEBATTLESHIP"
            echo "- Deployment: none; main triggers Deploy main"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
